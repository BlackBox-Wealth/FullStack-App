version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: wealthvault-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - wealthvault

  redis:
    image: redis:7-alpine
    container_name: wealthvault-redis
    ports:
      - "6379:6379"
    networks:
      - wealthvault

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: wealthvault-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - wealthvault

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: wealthvault-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - wealthvault

  backend:
    build: ./backend
    container_name: wealthvault-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
    networks:
      - wealthvault

  frontend:
    build: ./frontend
    container_name: wealthvault-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - wealthvault

volumes:
  mongo_data:

networks:
  wealthvault:
    driver: bridge
